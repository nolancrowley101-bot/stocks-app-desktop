name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry + target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev

      - name: npm install
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Stocks Services ${{ github.ref_name }}"
          releaseBody: "Native desktop build of stocks-services.com."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  deploy-to-vps:
    name: Publish to stocks-services.com/downloads
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Pull release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./artifacts
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.exe" --pattern "*.dmg" --pattern "*.AppImage" --pattern "*.deb" \
            --dir ./artifacts
          ls -la ./artifacts

      - name: Rename to "latest" aliases
        run: |
          cd artifacts
          for f in *.exe *.dmg *.AppImage *.deb; do
            [ -e "$f" ] || continue
            # Stocks-Services_0.1.0_x64-setup.exe -> Stocks-Services_latest_x64-setup.exe
            cp "$f" "$(echo "$f" | sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+_/_latest_/')"
          done
          # checksums
          sha256sum * > SHA256SUMS
          ls -la

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "artifacts/*"
          target: "/srv/stocks-downloads/"
          strip_components: 1
          overwrite: true
